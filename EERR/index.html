<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Resultados - Dashboard</title>
    
    <link rel="icon" type="image/png" href="https://www.preomed.cl/wp-content/uploads/2025/05/iso-66x66.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #eff6ff;
            --accent: #2563eb;
            --text: #1f2937;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --success: #059669;
            --error: #dc2626;
            --highlight: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 40px 20px; line-height: 1.5; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 20px; }
        header img { max-height: 80px; margin: 0 auto 20px auto; display: block; object-fit: contain; }
        h1 { color: var(--primary); font-size: 24px; text-transform: uppercase; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }

        #loadingMessage { text-align: center; padding: 20px; font-weight: 600; color: var(--accent); background: var(--primary-light); border-radius: 8px; margin-bottom: 20px; }

        .upload-section { display: none; background: #fff1f2; border: 2px dashed #f43f5e; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 30px; }
        .upload-section label { font-weight: 600; color: #e11d48; cursor: pointer; display: block; margin-bottom: 10px; }
        
        .controls { display: none; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 30px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 13px; font-weight: 600; color: #475569; text-transform: uppercase; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
        select:focus { border-color: var(--accent); }

        table { width: 100%; border-collapse: collapse; font-size: 14px; display: none; }
        th { background: var(--primary); color: white; text-align: left; padding: 12px 15px; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        td { padding: 10px 15px; border-bottom: 1px solid var(--border); }
        .text-right { text-align: right; }
        
        .row-total { font-weight: 700; background-color: var(--highlight); color: var(--primary); border-top: 1px solid #cbd5e1; transition: background-color 0.2s; }
        .row-total:hover { background-color: #e2e8f0; }
        .row-grand-total { font-weight: 800; background-color: var(--primary-light); color: var(--primary); border-top: 2px solid var(--primary); font-size: 15px; }
        
        /* Modificadores Visuales Solicitados */
        .no-border-top { border-top: none !important; }
        .no-border-bottom td { border-bottom: none !important; }
        .pe-highlight { 
            background-color: #bfdbfe !important; 
            color: #1e3a8a !important; 
            font-size: 16px !important; 
            font-weight: 900 !important; 
            border-top: 3px solid #1e3a8a !important; 
        }
        .pe-highlight td { border-bottom: none !important; }
        
        /* Estilos de 3 Niveles */
        .row-subitem td:first-child { padding-left: 35px !important; color: #334155; font-size: 13px; font-weight: 600; border-left: 3px solid var(--highlight); }
        .row-subitem.clickable:hover { background-color: #f1f5f9; }
        .row-subsubitem td:first-child { padding-left: 65px !important; color: #64748b; font-size: 12px; border-left: 3px solid #cbd5e1; }
        
        .toggle-icon { display: inline-block; width: 16px; font-size: 10px; color: var(--accent); text-align: center; margin-right: 6px; }
        
        .val-positive { color: var(--success); }
        .val-negative { color: var(--error); }
        .val-percent { font-size: 13px; color: #64748b; font-weight: 600; }
        
        .empty-state { text-align: center; color: #64748b; padding: 20px; display: none; }
    </style>
</head>
<body style="display: none;">

<div class="container">
    <header>
        <img src="https://www.preomed.cl/wp-content/uploads/2025/05/350px-rgb-min.webp" alt="Logo Preomed">
        <h1>Estado de Resultados</h1>
        <div class="subtitle">Análisis por Sucursal y Periodo (Mes/Año)</div>
    </header>

    <div id="loadingMessage">
        ⏳ Sincronizando datos automáticamente desde Google Sheets...
    </div>

    <div class="upload-section" id="upload-section">
        <label for="csvFileInput">⚠️ No se pudo conectar automáticamente. Sube el archivo CSV manualmente:</label>
        <input type="file" id="csvFileInput" accept=".csv" />
    </div>

    <div class="controls" id="controls">
        <div class="control-group">
            <label for="sucursalSelect">Sucursal</label>
            <select id="sucursalSelect">
                <option value="ALL">PREOMED SALUD</option>
            </select>
        </div>
        <div class="control-group">
            <label for="periodoSelect">Periodo (Mes / Año)</label>
            <select id="periodoSelect"></select>
        </div>
    </div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>Categoría / Concepto</th>
                <th class="text-right">Monto</th>
                <th class="text-right">%</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <div id="emptyState" class="empty-state">No hay datos para mostrar con los filtros seleccionados.</div>
</div>

<script>
    let globalData = [];
    let periodosDisponibles = [];
    let ordenCategoriasUnicas = []; 
    
    const URL_BASE_DATOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT6A2yPziLhHV1MTLYKTDYMFCqnor0GHX_2fsMHu_Y36C7I8cyt_oPtDIdDJpXhoA/pub?gid=1171120709&single=true&output=csv&_t=" + new Date().getTime();

    window.onload = function() {
        Papa.parse(URL_BASE_DATOS, {
            download: true,
            skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('loadingMessage').style.display = 'none';
                if (results.data && results.data.length > 0) {
                    procesarDatos(results.data);
                } else {
                    document.getElementById('upload-section').style.display = 'block';
                }
            },
            error: function(err) {
                console.error("Error cargando Google Sheets:", err);
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('upload-section').style.display = 'block';
            }
        });
    };

    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        Papa.parse(file, {
            skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('upload-section').style.display = 'none';
                procesarDatos(results.data);
            }
        });
    });

    function cleanNumber(rawValue) {
        if (typeof rawValue === 'number') return rawValue;
        if (!rawValue) return 0;
        let s = String(rawValue).trim();
        let isNeg = false;
        
        if (s.startsWith('(') && s.endsWith(')')) {
            isNeg = true;
            s = s.slice(1, -1).trim();
        } else if (s.startsWith('-')) {
            isNeg = true;
            s = s.slice(1).trim();
        }
        
        s = s.replace(/[^0-9.,]/g, '');
        if (s === '') return 0;
        if (s.includes('.') && s.includes(',')) {
            s = s.replace(/\\./g, '').replace(',', '.');
        } else if (s.includes(',')) {
            s = s.replace(',', '.');
        } else if (s.split('.').length > 2) {
            s = s.replace(/\\./g, '');
        } else if (s.includes('.') && s.split('.')[1].length === 3) {
            s = s.replace(/\\./g, '');
        }
        
        let val = parseFloat(s);
        if (isNaN(val)) return 0;
        return isNeg ? -val : val;
    }

    function procesarDatos(allRows) {
        let headerIndex = -1;
        for(let i = 0; i < allRows.length; i++) {
            const row = allRows[i].map(col => typeof col === 'string' ? col.trim() : col);
            if(row.includes('SUCURSAL') && row.includes('CATEGORIA')) {
                headerIndex = i;
                break;
            }
        }
        
        if(headerIndex === -1) {
            alert('No se detectaron los encabezados SUCURSAL y CATEGORIA. Verifica el archivo.');
            document.getElementById('upload-section').style.display = 'block';
            return;
        }
        
        const fields = allRows[headerIndex].map(f => typeof f === 'string' ? f.trim() : f);
        const dataRows = allRows.slice(headerIndex + 1);
        periodosDisponibles = fields.filter(f => f !== 'SUCURSAL' && f !== 'CATEGORIA' && f !== '');
        
        let processedRows = [];
        dataRows.forEach(rowArray => {
            let obj = {};
            fields.forEach((field, index) => {
                obj[field] = rowArray[index];
            });
            
            if (!obj.CATEGORIA || String(obj.CATEGORIA).trim() === '') return;
            
            let categoriaOriginal = String(obj.CATEGORIA);

            if (categoriaOriginal === 'GASTOS GENERALES') {
                obj.CATEGORIA = 'OTROS GASTOS'; 
            } else if (categoriaOriginal === 'GASTOS GENERALES ') {
                obj.CATEGORIA = 'GASTOS GENERALES'; 
            }

            let catStr = String(obj.CATEGORIA).trim();
            let catUpper = catStr.toUpperCase();
            
            if (catUpper.includes('PÉRDIDA DEL EJERCICIO') || catUpper.includes('PERDIDA DEL EJERCICIO') || catUpper.includes('UTILIDAD ANTES')) {
                obj.CATEGORIA = 'UTILIDAD ANTES DE IMPUESTO';
            } else if (catUpper.includes('PÉRDIDA DESPUÉS') || catUpper.includes('PERDIDA DESPUES') || catUpper.includes('UTILIDAD DESPUES') || catUpper.includes('UTILIDAD DESPUÉS')) {
                obj.CATEGORIA = 'UTILIDAD DESPUES DE IMPUESTO';
            }
            
            processedRows.push(obj);
        });

        globalData = processedRows;

        ordenCategoriasUnicas = [];
        globalData.forEach(row => {
            const cat = String(row.CATEGORIA).trim();
            if (!ordenCategoriasUnicas.includes(cat)) {
                ordenCategoriasUnicas.push(cat);
            }
        });

        let maxIdx = -1;
        for (let i = ordenCategoriasUnicas.length - 1; i >= 0; i--) {
            let cUpper = ordenCategoriasUnicas[i].toUpperCase();
            if (cUpper.includes('PUNTO DE EQUILIBRIO') || cUpper.includes('UTILIDAD') || cUpper.includes('IMPUESTO')) {
                maxIdx = i;
                break;
            }
        }
        
        if (maxIdx !== -1) {
            ordenCategoriasUnicas = ordenCategoriasUnicas.slice(0, maxIdx + 1);
        }
        ordenCategoriasUnicas = ordenCategoriasUnicas.filter(c => c.toUpperCase().trim() !== 'RESULTADO');

        inicializarFiltros();
        document.getElementById('controls').style.display = 'grid';
        document.getElementById('resultsTable').style.display = 'table';
    }

    function inicializarFiltros() {
        const sucursalSelect = document.getElementById('sucursalSelect');
        sucursalSelect.innerHTML = '<option value="ALL">PREOMED SALUD</option>';
        const sucursales = [...new Set(globalData.map(r => r.SUCURSAL).filter(s => s))].sort();
        
        sucursales.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            sucursalSelect.appendChild(opt);
        });

        const periodoSelect = document.getElementById('periodoSelect');
        periodoSelect.innerHTML = '';
        periodosDisponibles.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            opt.textContent = p;
            periodoSelect.appendChild(opt);
        });
        
        const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
        let fechaActual = new Date();
        fechaActual.setMonth(fechaActual.getMonth() - 1);
        let nombreMesAnterior = meses[fechaActual.getMonth()];

        const mesEncontrado = periodosDisponibles.find(p => p.trim().toUpperCase() === nombreMesAnterior);
        if (mesEncontrado) {
            periodoSelect.value = mesEncontrado;
        } else {
            const anioTotal = periodosDisponibles.find(p => !isNaN(p));
            if (anioTotal) periodoSelect.value = anioTotal;
        }

        sucursalSelect.addEventListener('change', renderizarTabla);
        periodoSelect.addEventListener('change', renderizarTabla);

        renderizarTabla();
    }

    function formatearMoneda(valor) {
        return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 }).format(valor);
    }
    
    function formatName(name, val) {
        if (val < 0 && name.toUpperCase().includes('UTILIDAD')) {
            return name.toUpperCase().replace(/UTILIDAD/ig, 'PÉRDIDA');
        } else if (val >= 0 && name.toUpperCase().includes('PÉRDIDA')) {
            return name.toUpperCase().replace(/PÉRDIDA/ig, 'UTILIDAD').replace(/PERDIDA/ig, 'UTILIDAD');
        }
        return name;
    }

    function toggleGrupo(parentId, e) {
        if (e) e.stopPropagation(); 
        
        const children = document.querySelectorAll('.child-of-' + parentId);
        if (children.length === 0) return;
        
        let firstChild = Array.from(children).find(c => c.classList.contains('direct-child-of-' + parentId));
        if (!firstChild) return;
        
        const isHidden = firstChild.style.display === 'none';
        const icon = document.querySelector('#' + parentId + ' .toggle-icon');
        if (icon) icon.textContent = isHidden ? '▼' : '▶';

        if (isHidden) {
            children.forEach(c => {
                if (c.classList.contains('direct-child-of-' + parentId)) c.style.display = 'table-row';
            });
        } else {
            children.forEach(c => {
                c.style.display = 'none';
                const cIcon = c.querySelector('.toggle-icon');
                if (cIcon) cIcon.textContent = '▶';
            });
        }
    }

    function renderizarTabla() {
        const sucursal = document.getElementById('sucursalSelect').value;
        const periodo = document.getElementById('periodoSelect').value;
        const tbody = document.querySelector('#resultsTable tbody');
        const emptyState = document.getElementById('emptyState');
        const table = document.getElementById('resultsTable');
        tbody.innerHTML = '';

        const agrupado = {};
        
        globalData.forEach(row => {
            if (sucursal !== 'ALL' && row.SUCURSAL !== sucursal) return;
            const cat = String(row.CATEGORIA).trim();
            if (!ordenCategoriasUnicas.includes(cat)) return;
            const val = cleanNumber(row[periodo]);
            if (!agrupado[cat]) agrupado[cat] = 0;
            agrupado[cat] += val;
        });
        
        if (Object.keys(agrupado).length === 0) {
            table.style.display = 'none';
            emptyState.style.display = 'block';
            return;
        }

        table.style.display = 'table';
        emptyState.style.display = 'none';

        const getV = (str) => {
            let k = Object.keys(agrupado).find(key => key.toUpperCase() === str.toUpperCase());
            if (!k) k = Object.keys(agrupado).find(key => key.toUpperCase().includes(str.toUpperCase()));
            return k ? agrupado[k] : 0;
        };

        const setV = (str, val) => {
            let k = Object.keys(agrupado).find(key => key.toUpperCase() === str.toUpperCase());
            if (!k) k = Object.keys(agrupado).find(key => key.toUpperCase().includes(str.toUpperCase()));
            if (k) agrupado[k] = val;
        };

        const calcIngresos = getV('INGRESOS POR VENTA');
        const calcCostosVenta = getV('COSTOS DE VENTA');
        const calcMargenBruto = calcIngresos - calcCostosVenta;
        setV('MARGEN BRUTO', calcMargenBruto);

        const calcGastosGen = getV('GASTOS GENERALES'); 
        const calcGastosRRHH = getV('GASTOS DE RR. HH.') || getV('GASTOS DE RR.HH.');
        const calcMargenOp = calcMargenBruto - calcGastosGen - calcGastosRRHH;
        setV('MARGEN OPERACIONAL', calcMargenOp);

        const calcCostosFin = getV('COSTOS FINANCIEROS');
        const calcDepreciacion = getV('DEPRECIACIÓN') || getV('DEPRECIACION');
        const calcUtilidadAntes = calcMargenOp - calcCostosFin - calcDepreciacion;
        setV('UTILIDAD ANTES', calcUtilidadAntes);

        const calcImpuesto = getV('IMPUESTO A LA RENTA');
        const calcUtilidadDespues = calcUtilidadAntes - calcImpuesto;
        setV('UTILIDAD DESPUES', calcUtilidadDespues);

        const calcCostosFijos = getV('COSTOS FIJOS');
        let calcPuntoEq = 0;
        if (calcIngresos > 0) {
            const mgContribucion = calcMargenBruto / calcIngresos;
            if (mgContribucion !== 0) calcPuntoEq = calcCostosFijos / mgContribucion;
        }
        setV('PUNTO DE EQUILIBRIO', calcPuntoEq);

        let valorBase = calcIngresos;

        const Nivel1 = [
            'INGRESOS POR VENTA', 'INGRESOS POR VENTAS',
            'COSTOS DE VENTA', 'COSTO DE VENTA',
            'MARGEN BRUTO',
            'GASTOS GENERALES',
            'GASTOS DE RR. HH.', 'GASTOS DE RR.HH.',
            'MARGEN OPERACIONAL',
            'COSTOS FINANCIEROS',
            'DEPRECIACIÓN', 'DEPRECIACION',
            'UTILIDAD ANTES DE IMPUESTO', 'UTILIDAD ANTES',
            'IMPUESTO A LA RENTA',
            'UTILIDAD DESPUES DE IMPUESTO', 'UTILIDAD DESPUES', 'UTILIDAD NETA',
            'COSTOS FIJOS', 'COSTO FIJO',
            'COSTOS VARIABLES', 'COSTO VARIABLE',
            'PUNTO DE EQUILIBRIO'
        ];

        const Nivel2 = [
            'MATERIALES E INSUMOS', 'MATERIALES E INSUMO',
            'SUELDOS OPERACIONALES',
            'SERVICIOS EXTERNOS',
            'COMISIONES DE VENTA', 'COMISIONES DE VENTAS',
            'GASTOS CUENTAS',
            'GASTOS FIJOS',
            'MKT Y PUBLICIDAD', 'MARKETING Y PUBLICIDAD',
            'GTO GENERALES', /* Aquí se eliminó OTROS GASTOS para que quede en Nivel 3 */
            'SUELDOS ADMINISTRATIVOS', 'SUELDOS VENDEDORES',
            'GASTOS FINANCIEROS', 'SEGUROS', 'INTERESES BANCARIOS',
            'EQUIPOS MEDICOS', 'EQUIPOS Y MAQUINARIAS'
        ];

        let tree = [];
        let curL1 = null;
        let curL2 = null;

        ordenCategoriasUnicas.forEach(cat => {
            let cUpper = cat.toUpperCase();
            let isL1 = Nivel1.some(n => cUpper === n || cUpper.includes(n));
            let isL2 = Nivel2.some(n => cUpper === n || cUpper.includes(n));
            let isTotalRow = cUpper.includes('EQUILIBRIO') || cUpper.includes('UTILIDAD') || cUpper.includes('MARGEN') || cUpper.includes('IMPUESTO') || cUpper.includes('COSTOS FIJOS') || cUpper.includes('COSTOS VARIABLES');

            if (isL1 || isTotalRow) {
                curL1 = { name: cat, isTotal: isTotalRow, children: [] };
                tree.push(curL1);
                curL2 = null; 
            } else if (isL2) {
                curL2 = { name: cat, children: [] };
                if (curL1) curL1.children.push({ type: 'L2', node: curL2 });
                else {
                    curL1 = { name: cat, isTotal: false, children: [] };
                    tree.push(curL1);
                }
            } else {
                if (curL2) {
                    curL2.children.push(cat);
                } else if (curL1) {
                    curL1.children.push({ type: 'L3', name: cat });
                }
            }
        });

        let l1Counter = 0;
        let l2Counter = 0;

        tree.forEach(l1 => {
            let valL1 = agrupado[l1.name] || 0;
            let hasChildren = l1.children.some(child => {
                if (child.type === 'L3') return (agrupado[child.name] || 0) !== 0;
                if (child.type === 'L2') {
                    if ((agrupado[child.node.name] || 0) !== 0) return true;
                    return child.node.children.some(l3 => (agrupado[l3] || 0) !== 0);
                }
                return false;
            });

            if (valL1 === 0 && !hasChildren) return;

            let tr1 = document.createElement('tr');
            let idL1 = 'l1-' + l1Counter++;
            tr1.className = l1.isTotal ? 'row-grand-total' : 'row-total';
            
            let nameUpper = l1.name.toUpperCase();
            
            if (nameUpper.includes('UTILIDAD ANTES')) {
                tr1.classList.add('no-border-bottom'); 
            }
            if (nameUpper.includes('IMPUESTO A LA RENTA')) {
                tr1.classList.add('no-border-top'); 
            }
            if (nameUpper.includes('UTILIDAD DESPUES') || nameUpper.includes('UTILIDAD NETA')) {
                tr1.classList.add('no-border-bottom'); 
            }
            if (nameUpper.includes('COSTOS FIJOS')) {
                tr1.classList.add('no-border-top'); 
                tr1.classList.add('no-border-bottom'); 
            }
            if (nameUpper.includes('COSTOS VARIABLES')) {
                tr1.classList.add('no-border-top'); 
            }
            if (nameUpper.includes('EQUILIBRIO')) {
                tr1.classList.add('pe-highlight'); 
            }

            let nameFormattedL1 = formatName(l1.name, valL1);
            let catHtml = nameFormattedL1;
            
            if (!l1.isTotal && hasChildren) {
                tr1.id = idL1;
                tr1.style.cursor = 'pointer';
                tr1.onclick = function(e) { toggleGrupo(this.id, e); };
                catHtml = `<span class="toggle-icon">▶</span> ${nameFormattedL1}`;
            }
            
            let pctL1 = (valorBase !== 0 && !l1.name.toUpperCase().includes('EQUILIBRIO')) ? ((valL1 / valorBase) * 100).toFixed(1) + '%' : '-';
            
            tr1.innerHTML = `
                <td>${catHtml}</td>
                <td class="text-right ${valL1 < 0 ? 'val-negative' : ''}">${formatearMoneda(valL1)}</td>
                <td class="text-right val-percent">${pctL1}</td>
            `;
            tbody.appendChild(tr1);

            l1.children.forEach(child => {
                if (child.type === 'L3') {
                    let valL3 = agrupado[child.name] || 0;
                    if (valL3 === 0) return;
                    
                    let tr3 = document.createElement('tr');
                    tr3.className = `row-subsubitem child-of-${idL1} direct-child-of-${idL1}`;
                    tr3.style.display = 'none';
                    
                    let nameFormattedL3 = formatName(child.name, valL3);
                    let pctL3 = valorBase !== 0 ? ((valL3 / valorBase) * 100).toFixed(1) + '%' : '-';
                    
                    tr3.innerHTML = `
                        <td>${nameFormattedL3}</td>
                        <td class="text-right ${valL3 < 0 ? 'val-negative' : ''}">${formatearMoneda(valL3)}</td>
                        <td class="text-right val-percent">${pctL3}</td>
                    `;
                    tbody.appendChild(tr3);
                } else if (child.type === 'L2') {
                    let l2Node = child.node;
                    let valL2 = agrupado[l2Node.name] || 0;
                    let l2HasChildren = l2Node.children.some(l3 => (agrupado[l3] || 0) !== 0);
                    
                    if (valL2 === 0 && !l2HasChildren) return;

                    let tr2 = document.createElement('tr');
                    let idL2 = 'l2-' + l2Counter++;
                    tr2.className = `row-subitem child-of-${idL1} direct-child-of-${idL1}`;
                    tr2.style.display = 'none';
                    
                    let nameFormattedL2 = formatName(l2Node.name, valL2);
                    let l2Html = nameFormattedL2;
                    
                    if (l2HasChildren) {
                        tr2.id = idL2;
                        tr2.classList.add('clickable');
                        tr2.onclick = function(e) { toggleGrupo(this.id, e); };
                        l2Html = `<span class="toggle-icon">▶</span> ${nameFormattedL2}`;
                    }

                    let pctL2 = valorBase !== 0 ? ((valL2 / valorBase) * 100).toFixed(1) + '%' : '-';

                    tr2.innerHTML = `
                        <td>${l2Html}</td>
                        <td class="text-right ${valL2 < 0 ? 'val-negative' : ''}">${formatearMoneda(valL2)}</td>
                        <td class="text-right val-percent">${pctL2}</td>
                    `;
                    tbody.appendChild(tr2);

                    l2Node.children.forEach(l3Name => {
                        let valL3 = agrupado[l3Name] || 0;
                        if (valL3 === 0) return;
                        let tr3 = document.createElement('tr');
                        tr3.className = `row-subsubitem child-of-${idL1} child-of-${idL2} direct-child-of-${idL2}`;
                        tr3.style.display = 'none';
                        
                        let nameFormattedL3 = formatName(l3Name, valL3);
                        let pctL3 = valorBase !== 0 ? ((valL3 / valorBase) * 100).toFixed(1) + '%' : '-';
                        
                        tr3.innerHTML = `
                            <td>${nameFormattedL3}</td>
                            <td class="text-right ${valL3 < 0 ? 'val-negative' : ''}">${formatearMoneda(valL3)}</td>
                            <td class="text-right val-percent">${pctL3}</td>
                        `;
                        tbody.appendChild(tr3);
                    });
                }
            });
        });
    }
</script>
